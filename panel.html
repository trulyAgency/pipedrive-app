<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Truly panel</title>
<script src="https://cdn.jsdelivr.net/npm/@pipedrive/app-extensions-sdk@0/dist/index.umd.js"></script>
<style>
  :root { --text:#1b1f24; --muted:#5b6470; --line:#e3e6ea; --blue:#0a66c2; --green:#1a7f37; --red:#c62828; --bg:#ffffff; --chip:#f2f4f7; }
  :root[data-theme="dark"] { --text:#e8eaed; --muted:#a0a7b1; --line:#3a3f45; --bg:transparent; --chip:#2a2e33; }
  html, body { margin:0; padding:0; background:var(--bg); }
  body { font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:1.45; color:var(--text); padding:10px 16px 12px; }
  #state { background:var(--chip); border-radius:6px; padding:8px 10px; margin-bottom:10px; color:var(--muted); }
  #state.ok { color:var(--green); }
  #state.err { color:var(--red); }
  #state:empty { display:none; }
  #buttons { display:flex; flex-direction:column; gap:8px; }
  button { appearance:none; border:0; border-radius:6px; padding:8px 12px; font-weight:600; font-size:13px; line-height:1.2; font-family:inherit; color:#fff; background:var(--blue); cursor:pointer; width:100%; text-align:center; }
  button.confirm { background:var(--green); }
  button:disabled { opacity:.55; cursor:default; }
  #msg { margin-top:10px; color:var(--muted); }
  #msg.ok { color:var(--green); }
  #msg.err { color:var(--red); }
  #msg:empty { display:none; }
</style>
</head>
<body>
<div id="state">Ladataan…</div>
<div id="buttons"></div>
<div id="msg"></div>

<script>
(function () {
  // n8n-rajapinta. Kaikki logiikka ja tarkistukset (JWT) ovat n8n:ssä, ei tässä sivussa.
  var API = 'https://truly.app.n8n.cloud/webhook/';
  var CONFIG_URL = API + 'truly-pd-panel-config-7a3d9e21-4c6b-4f0a-8e15-b2c94d6f3a70';
  var ACTION_URL = API + 'truly-pd-panel-action-9c4f2a7e-1b3d-4e8a-b6f0-5d2c7e9a1f48';

  var params = new URLSearchParams(location.search);
  var stateEl = document.getElementById('state');
  var buttonsEl = document.getElementById('buttons');
  var msgEl = document.getElementById('msg');
  var sdk = null;

  if (params.get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

  var NS = window.AppExtensionsSDK;
  var SDKClass = NS && (typeof NS === 'function' ? NS : (NS.default || NS.AppExtensionsSDK));
  var Cmd = (NS && NS.Command) || {};
  var CMD_SNACK = Cmd.SHOW_SNACKBAR || 'show_snackbar';
  var CMD_RESIZE = Cmd.RESIZE || 'resize';
  var CMD_TOKEN = Cmd.GET_SIGNED_TOKEN || 'get_signed_token';

  function setText(el, text, cls) {
    el.textContent = text || '';
    el.className = cls || '';
    resize();
  }

  function resize() {
    if (!sdk) return;
    var h = Math.min(750, Math.max(100, document.body.scrollHeight + 4));
    sdk.execute(CMD_RESIZE, { height: h }).catch(function () {});
  }

  // Pipedriven token vanhenee 5 minuutissa: haetaan tuore ennen jokaista kutsua.
  function freshToken() {
    if (!sdk) return Promise.resolve(params.get('token'));
    return sdk.execute(CMD_TOKEN).then(function (r) {
      return (r && r.token) || params.get('token');
    }).catch(function () { return params.get('token'); });
  }

  function baseFields(token) {
    return {
      token: token || '',
      selectedIds: params.get('selectedIds') || '',
      userId: params.get('userId') || '',
      companyId: params.get('companyId') || '',
      resource: params.get('resource') || '',
      view: params.get('view') || ''
    };
  }

  function renderButtons(buttons, blocked) {
    buttonsEl.innerHTML = '';
    (buttons || []).forEach(function (b) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = b.label;
      btn.disabled = !!blocked;
      var armed = false;
      btn.addEventListener('click', function () {
        if (!armed) {
          armed = true;
          btn.textContent = 'Vahvista: ' + b.label;
          btn.className = 'confirm';
          setTimeout(function () {
            if (armed && !btn.disabled) { armed = false; btn.textContent = b.label; btn.className = ''; }
          }, 5000);
          return;
        }
        armed = false;
        runAction(b, btn);
      });
      buttonsEl.appendChild(btn);
    });
    resize();
  }

  function runAction(b, btn) {
    buttonsEl.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
    btn.textContent = 'Lähetetään…';
    setText(msgEl, 'Käsitellään…');
    freshToken().then(function (token) {
      var f = baseFields(token);
      f.button = b.id;
      // Lomakemuotoinen POST on "simple request", joten selain ei tee CORS-esikyselyä.
      return fetch(ACTION_URL, { method: 'POST', body: new URLSearchParams(f) });
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, message: 'Virheellinen vastaus (HTTP ' + r.status + ').' }; });
    }).then(function (j) {
      setText(msgEl, j.message || 'Ei vastausta.', j.ok ? 'ok' : 'err');
      if (sdk) sdk.execute(CMD_SNACK, { message: j.ok ? 'Pyyntö vastaanotettu' : 'Pyyntöä ei lähetetty' }).catch(function () {});
    }).catch(function (e) {
      setText(msgEl, 'Yhteysvirhe: ' + e.message, 'err');
    }).then(function () {
      return loadConfig();
    });
  }

  function loadConfig() {
    return freshToken().then(function (token) {
      var q = new URLSearchParams(baseFields(token));
      return fetch(CONFIG_URL + '?' + q.toString());
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, message: 'Virheellinen vastaus (HTTP ' + r.status + ').' }; });
    }).then(function (j) {
      if (!j.ok) { setText(stateEl, j.message || 'Paneelin lataus epäonnistui.', 'err'); renderButtons([], true); return; }
      setText(stateEl, j.status || '', j.tyyppi === 'ok' ? 'ok' : (j.tyyppi === 'err' ? 'err' : ''));
      renderButtons(j.buttons, j.estetty);
    }).catch(function (e) {
      setText(stateEl, 'Yhteysvirhe: ' + e.message, 'err');
    });
  }

  // SDK pitää alustaa 10 sekunnissa, joten se tehdään ennen n8n-kutsuja.
  if (!SDKClass) { setText(stateEl, 'Pipedrive SDK ei latautunut.', 'err'); return; }
  new SDKClass().initialize({ size: { height: 120 } }).then(function (s) {
    sdk = s;
    return loadConfig();
  }).catch(function (e) {
    setText(stateEl, 'SDK-virhe: ' + (e && e.message ? e.message : e), 'err');
  });
})();
</script>
</body>
</html>
